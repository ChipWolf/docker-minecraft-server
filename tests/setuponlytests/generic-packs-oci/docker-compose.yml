services:
  mc:
    image: ${IMAGE_TO_TEST:-itzg/minecraft-server}
    environment:
      EULA: "true"
      SETUP_ONLY: "true"
      # Public OCI artifact: shared base layer + per-pack overlay layer.
      # Source: https://github.com/ChipWolf/oci-modpack-demo
      GENERIC_PACKS: oci://ghcr.io/chipwolf/oci-modpack-demo/tech:latest
      LOG_TIMESTAMP: "true"
      # the following are only used to speed up test execution
      TYPE: CUSTOM
      CUSTOM_SERVER: /servers/fake.jar
      VERSION: 1.18.1
      DEBUG: "true"
    volumes:
      - ./data:/data
      - ./fake.jar:/servers/fake.jar
      # While the matching mc-image-helper release is unpublished, point
      # MC_HELPER_LOCAL at the local build's `install/mc-image-helper`
      # directory so this test exercises the install-oci-pack subcommand.
      # require.sh skips this test when the variable is unset, which is
      # the appropriate behaviour for upstream CI runs.
      - ${MC_HELPER_LOCAL}:/usr/share/mc-image-helper:ro
